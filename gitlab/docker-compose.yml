version: '3.8'
services:
  gitlab:
    image: gitlab/gitlab-ce:latest
    container_name: gitlab
    hostname: gitlab.gfz.local
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://gitlab.gfz.local:8888'
        gitlab_rails['gitlab_shell_ssh_port'] = 2224
    ports:
      - "8888:8888"
      - "2224:22"
    volumes:
      - ./config:/etc/gitlab
      - ./logs:/var/log/gitlab
      - ./data:/var/opt/gitlab
    restart: always