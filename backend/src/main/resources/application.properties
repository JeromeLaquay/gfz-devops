spring.application.name=gfz-online-backend
server.port=8080

# Database
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:gfzdb}
spring.datasource.username=${DB_USER:gfzuser}
spring.datasource.password=${DB_PASSWORD:gfzpass}

# JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=${JWT_SECRET:mySecretKeyForJWTTokenGenerationThatShouldBeAtLeast256BitsLong}
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS
spring.web.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000}
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*

# HTTP Request Size (pour les images en base64)
server.max-http-header-size=64KB
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
# JSON payload size (pour les grandes requêtes avec images base64)
spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
# Tomcat max post size
server.tomcat.max-http-post-size=50MB

# Email Configuration
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:laquay.jerome@gmail.com}
spring.mail.password=${MAIL_PASSWORD:nngm hrks zdsa dlwl}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.email.from-name=GFZ Online
app.frontend.url=${FRONTEND_URL:http://localhost:3000}
