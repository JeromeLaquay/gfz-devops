apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: test
data:
  DB_HOST: postgres.test.svc.cluster.local
  DB_PORT: "5432"
  DB_NAME: gfzdb_test
  DB_USER: gfzuser
  CORS_ORIGINS: http://test.gfz.local,http://test.gfz.local:30424
  JWT_EXPIRATION: "3600000"
---
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: test
type: Opaque
stringData:
  DB_PASSWORD: testpass123
  JWT_SECRET: GC7M871B+nfb9UR1M9uEoZG5/iyYxrXjaauAd5m93AY=
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: gfz-backend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: backend-config
        - secretRef:
            name: backend-secret
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/actuator/health
            port: 8080
          initialDelaySeconds: 90
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /api/actuator/health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 5
          timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: test
spec:
  selector:
    app: backend
  ports:
  - port: 8080
    targetPort: 8080
  type: ClusterIP
